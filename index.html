<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>역학 탐구실 | 개념을 발견하는 물리</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="역학 탐구실 홈">
        <span class="brand-mark" aria-hidden="true">∑</span>
        <span>개념<span class="brand-light">탐구실</span></span>
      </a>
      <div class="topbar-right">
        <span class="course-label"><span class="status-dot"></span> 고급물리학 · 역학</span>
        <div class="xp-pill"><span aria-hidden="true">✦</span><strong id="xp-total">0</strong><span>XP</span></div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="학습 메뉴">
        <div class="sidebar-heading">학습 여정 <span id="lesson-count">0 / 4</span></div>
        <nav id="lesson-nav" class="lesson-nav"></nav>
        <div class="sidebar-note">
          <span class="note-icon" aria-hidden="true">✳</span>
          <p>답을 먼저 예상하고<br>실험으로 확인해 보세요.</p>
        </div>
        <div class="sidebar-footer">나의 학습은 이 기기에 저장돼요.</div>
      </aside>

      <main class="main-content">
        <div class="welcome-row">
          <div>
            <p class="eyebrow">오늘의 탐구</p>
            <h1>힘은 운동을 어떻게 바꿀까?</h1>
            <p class="welcome-copy">정답을 외우기보다, 변화를 관찰하고 개념을 연결해 보세요.</p>
          </div>
          <div class="streak-card">
            <span class="streak-icon" aria-hidden="true">✳</span>
            <span><strong id="completion-count">0</strong><small>개념 완료</small></span>
          </div>
        </div>

        <section class="progress-panel" aria-label="전체 학습 진행도">
          <div class="progress-copy"><strong>나의 학습 여정</strong><span id="progress-label">첫 번째 개념을 시작해 보세요</span></div>
          <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        </section>

        <section id="lesson-content" aria-live="polite"></section>
        <footer class="page-footer">직접 예측하고 확인하는 것이 개념을 오래 기억하는 방법이에요.</footer>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
